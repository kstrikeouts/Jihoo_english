# main 브랜치에 단어장이 바뀌면: 새 단어 음성 MP3 생성 → 저장소에 커밋
# (사이트 배포는 GitHub Pages 가 main 브랜치를 그대로 보여주므로 따로 필요 없음)
name: build-audio

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "tools/build_audio.py"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts

      - name: 음성 생성 (새로 추가·수정된 단어만)
        run: python tools/build_audio.py

      - name: 음성 파일 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || (git commit -m "음성 파일 자동 생성" && git push)
